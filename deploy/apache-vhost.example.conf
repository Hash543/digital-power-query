# Example Apache reverse proxy for the Next.js server on 127.0.0.1:18629.
# Requires: a2enmod proxy proxy_http headers ssl
<VirtualHost *:443>
    ServerName dpq.example.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/dpq.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/dpq.example.com/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    # flushpackets=on keeps streamed (Suspense) responses from being buffered.
    ProxyPass        / http://127.0.0.1:18629/ flushpackets=on
    ProxyPassReverse / http://127.0.0.1:18629/

    ErrorLog  ${APACHE_LOG_DIR}/dpq-error.log
    CustomLog ${APACHE_LOG_DIR}/dpq-access.log combined
</VirtualHost>
