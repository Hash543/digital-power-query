name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Generate route types
        run: npx next typegen

      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

      - name: Build
        run: npm run build
        env:
          APP_COMMIT: ${{ github.sha }}
          NEXT_TELEMETRY_DISABLED: 1

      - name: Package release
        run: bash deploy/package-release.sh app-${{ github.sha }}.tar.gz

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: release
          path: app-${{ github.sha }}.tar.gz
          retention-days: 7

  deploy:
    name: Deploy to VPS
    needs: ci
    # Set the repository variable DEPLOY_ENABLED=true once the VPS and secrets are ready.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      APP_DIR: /opt/digital-power-query
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy

      - uses: actions/download-artifact@v4
        with:
          name: release

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          trim() { printf '%s' "$1" | tr -d '[:space:]'; }
          HOST="$(trim "$HOST")"; PORT="$(trim "$PORT")"; USER="$(trim "$USER")"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pull every "<key-type> <base64-key>" pair out of VPS_KNOWN_HOSTS, ignoring comments,
          # CRLF, stray text and lines that were joined together when pasted. Then pin the keys to
          # the alias "vps". With HostKeyAlias they then match whether VPS_HOST is an IP or a domain
          # name, and whatever SSH port is used.
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' | awk '{
            for (i = 1; i < NF; i++)
              if ($i ~ /^(ssh-(rsa|ed25519|dss)|ecdsa-sha2-nistp(256|384|521)|sk-[a-z0-9@.-]+)$/ &&
                  $(i + 1) ~ /^AAAA[A-Za-z0-9+\/]+=*$/)
                print "vps", $i, $(i + 1)
          }' > ~/.ssh/known_hosts
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "VPS_KNOWN_HOSTS contains no host keys (expected the output of ssh-keyscan)." >&2
            echo "The secret has $(printf '%s' "$KNOWN_HOSTS" | wc -l) newline(s) and $(printf '%s' "$KNOWN_HOSTS" | wc -c) byte(s)." >&2
            exit 1
          fi
          echo "Pinned host key fingerprints:"
          ssh-keygen -lf ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $HOST
            Port $PORT
            User $USER
            HostKeyAlias vps
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Upload release
        run: |
          ssh vps "mkdir -p $APP_DIR/incoming $APP_DIR/releases $APP_DIR/bin"
          scp app-$SHA.tar.gz vps:$APP_DIR/incoming/
          scp deploy/remote-deploy.sh vps:$APP_DIR/bin/remote-deploy.sh

      - name: Activate release
        run: ssh vps "bash $APP_DIR/bin/remote-deploy.sh $SHA"
